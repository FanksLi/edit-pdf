[project]
name = "edit-pdf-backend"
version = "0.1.0"
description = "PDF 文字编辑系统后端 - 实现文字提取、渲染和修改"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "fonttools>=4.63.0",
    "pdf2docx>=0.5.13",
    "pymupdf>=1.27.2.3",
    "python-multipart>=0.0.28",
    "python-pptx>=1.0.2",
    "uvicorn>=0.46.0",
]
